<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Вход — OBLIQUE</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}">
  </head>
  <body class="login-body">
    <form class="login-box glass" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="eyebrow">OBLIQUE / Вход</span>
      <h1>С возвращением.</h1>
      {% with messages=get_flashed_messages() %}
        {% for message in messages %}
          <p class="error">{{ message }}</p>
        {% endfor %}
      {% endwith %}
      <label>
        Email
        <input type="email" name="email" required autocomplete="username">
      </label>
      <label>
        Пароль
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Войти в панель ↗</button>
      <a href="{{ url_for('shop.home') }}">← Назад в магазин</a>
    </form>
  </body>
</html>
{# Логин вынесен из base: до авторизации у администратора нет бокового меню. #}
